name: Publish Docker image

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_call:
    inputs:
      version_tag:
        description: Version tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          if [[ ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a version tag such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          if [[ "$VERSION_TAG" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${VERSION_TAG#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers must not have leading zeros" >&2
                exit 1
              fi
            done
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version_tag || github.ref_name }}

      - name: Check package version
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (`v${version}` !== process.env.VERSION_TAG) {
              console.error(`Package version ${version} does not match tag ${process.env.VERSION_TAG}`);
              process.exit(1);
            }
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run checks
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm lint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version_tag || github.ref_name }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
